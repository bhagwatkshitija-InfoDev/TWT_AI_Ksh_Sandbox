# Simplified Chinese (中文) Language-Specific Conventions

language: zh_CN
language_name: Simplified Chinese

punctuation:
  - id: chinese_punctuation
    name: Chinese Punctuation Marks
    severity: warning
    enabled: true
    description: Use proper Chinese punctuation marks instead of English equivalents
    rules:
      comma: "，"  # Chinese comma
      period: "。" # Chinese period
      question: "？"
      exclamation: "！"
      colon: "："
      semicolon: "；"
      left_quote: "「"
      right_quote: "」"
      left_double_quote: "『"
      right_double_quote: "』"
      left_paren: "（"
      right_paren: "）"
      dash: "——"
      avoid_marks: [".", ",", "\"", "'"]
    examples:
      - violation: "这是中文文本, 但使用了英文标点。"
        correction: "这是中文文本，但使用了中文标点。"
      - violation: 'He said "你好" today.'
        correction: 'He said「你好」today.'

character_widths:
  - id: fullwidth_vs_halfwidth
    name: Full-Width vs Half-Width Characters
    severity: warning
    enabled: true
    description: Use proper character widths (full-width for Chinese, half-width for English)
    rules:
      chinese_text_fullwidth: true
      english_numbers_halfwidth: false
      allow_mixed_in_code: true
    examples:
      - violation: "１２３个文件" # Full-width numbers
        correction: "123个文件" # Half-width numbers
      - violation: "Ａｂｃ定义" # Full-width letters
        correction: "Abc定义" # Half-width letters

font_consistency:
  - id: chinese_font_selection
    name: Chinese Font Selection
    severity: warning
    enabled: true
    description: Use consistent Chinese fonts
    rules:
      recommended_fonts: ["SimSun", "SimHei", "Microsoft YaHei", "WenQuanYi"]
      avoid_mixing: true
      preferred_serif: "SimSun"
      preferred_sans_serif: "SimHei"
    examples:
      - violation: "混合使用 SimSun 和 Microsoft YaHei"
        correction: "全文使用 SimSun 或 Microsoft YaHei"

spacing:
  - id: chinese_spacing
    name: CJK and Latin Spacing
    severity: info
    enabled: true
    description: Proper spacing between Chinese and Latin characters
    rules:
      space_cjk_latin: true
      space_cjk_numbers: true
    examples:
      - violation: "这是一个HTML标记" # No space between Chinese and English
        correction: "这是一个 HTML 标记" # Space added

line_breaking:
  - id: chinese_line_breaking
    name: Line Breaking Rules
    severity: info
    enabled: true
    description: Proper Chinese text line breaking
    rules:
      avoid_break_after: ["，", "。", "！", "？", "）", "」"]
      avoid_break_before: ["）", "」", "，", "。"]
    examples:
      - violation: "文本在 punctuation 处错误换行"
        correction: "文本在正确位置换行"

number_formatting:
  - id: chinese_number_format
    name: Number Formatting in Chinese
    severity: info
    enabled: true
    description: Proper formatting of numbers in Chinese text
    rules:
      use_halfwidth_numbers: true
      use_fullwidth_for_amounts: false
      comma_thousands_separator: false
    examples:
      - violation: "合计：１０,０００元" # Wrong format
        correction: "合计：10000元" # Correct format

terminology:
  - id: simplified_chars
    name: Simplified Characters
    severity: warning
    enabled: true
    description: Use only Simplified Chinese characters (GB2312/GBK), not Traditional
    rules:
      require_simplified: true
      avoid_traditional: true
    examples:
      - violation: "這是繁體中文" # Traditional characters
        correction: "这是简体中文" # Simplified characters

  - id: pinyin_consistency
    name: Pinyin Consistency (if used)
    severity: info
    enabled: false
    description: Consistent Pinyin format for pronunciation guides
    rules:
      use_pinyin: false
      tone_marks: "numbers"
    examples:
      - violation: "inconsistent tone mark format"
        correction: "consistent pinyin format"

special_characters:
  - id: special_symbols
    name: Special Symbols
    severity: info
    enabled: true
    description: Use appropriate Chinese special symbols
    rules:
      use_chinese_symbols: true
      ellipsis: "…" # Chinese ellipsis, not ...
      degree_symbol: "°"
    examples:
      - violation: "温度是 25 ... 度" # English ellipsis
        correction: "温度是 25… 度" # Chinese ellipsis

quote_nesting:
  - id: nested_quotations
    name: Nested Quotation Marks
    severity: info
    enabled: true
    description: Proper nesting of Chinese quotation marks
    rules:
      single_quotes: ["'", "'"]
      double_quotes: ["『", "』"]
      proper_nesting: true
    examples:
      - violation: "他说『我说「你好」给他』" # May be confusing
        correction: "他说「我对他说'你好'」" # Clearer nesting
